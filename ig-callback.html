<body>
<p>Finishing the Instagram sign-in on this computer…</p>
<p id="note" hidden>If nothing happens, the Studio is not running on this computer. Start it and connect again.</p>
<script>
  // Meta only redirects to https pages. This page hands the one-time code to the Studio running on the same computer.

  setTimeout(function () { document.getElementById("note").hidden = false; }, 4000);
</script>
